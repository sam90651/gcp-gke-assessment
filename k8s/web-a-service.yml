apiVersion: v1
kind: Service
metadata:
  name: web-a
  namespace: web
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "web-a-backend"}'
spec:
  type: ClusterIP
  selector:
    app: web-a
  ports:
    - name: http
      port: 80
      targetPort: 8080